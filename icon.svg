<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- squircle plate -->
    <clipPath id="plate">
      <rect x="16" y="16" width="480" height="480" rx="116" ry="116"/>
    </clipPath>
    <!-- soft lavender→white vertical wash -->
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0ff"/>
      <stop offset="0.55" stop-color="#ece2fc"/>
      <stop offset="1" stop-color="#f4eefb"/>
    </linearGradient>
    <!-- inner top light -->
    <radialGradient id="plateSheen" cx="0.5" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- chat bubble: purple → violet -->
    <linearGradient id="bubble" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#c6a4f4"/>
      <stop offset="0.5" stop-color="#a06be0"/>
      <stop offset="1" stop-color="#8d55d6"/>
    </linearGradient>
    <radialGradient id="bubbleSheen" cx="0.35" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#e9d8ff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#e9d8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- wing: violet → cyan -->
    <linearGradient id="wingA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7f7bf0"/>
      <stop offset="0.45" stop-color="#4f8bf5"/>
      <stop offset="1" stop-color="#3ed9f2"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7df2"/>
      <stop offset="0.5" stop-color="#57a0f5"/>
      <stop offset="1" stop-color="#46dcf0"/>
    </linearGradient>
    <linearGradient id="wingC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a08bf4"/>
      <stop offset="0.55" stop-color="#5fa9f6"/>
      <stop offset="1" stop-color="#5ee2ee"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6d4fc0" flood-opacity="0.35"/>
    </filter>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c3a80" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g clip-path="url(#plate)">
    <rect x="16" y="16" width="480" height="480" fill="url(#plateFill)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#plateSheen)"/>

    <!-- chat bubble disc with tail (bottom-left) -->
    <g filter="url(#softShadow)">
      <path d="M 258 96
               C 356 96 432 168 432 258
               C 432 348 356 420 258 420
               C 232 420 208 415 186 406
               L 118 432
               C 108 436 100 426 106 418
               L 138 366
               C 112 336 96 299 96 258
               C 96 168 172 96 258 96 Z"
            fill="url(#bubble)"/>
      <path d="M 258 96
               C 356 96 432 168 432 258
               C 432 348 356 420 258 420
               C 232 420 208 415 186 406
               L 118 432
               C 108 436 100 426 106 418
               L 138 366
               C 112 336 96 299 96 258
               C 96 168 172 96 258 96 Z"
            fill="url(#bubbleSheen)"/>
    </g>

    <!-- wing: three layered feathers sweeping to the top-right -->
    <g filter="url(#softShadow)">
      <!-- bottom feather (largest) -->
      <path d="M 148 372
               C 190 356 232 330 268 292
               C 306 252 330 206 340 158
               C 366 176 386 202 396 232
               C 372 316 300 372 208 384
               C 188 386 166 382 148 372 Z"
            fill="url(#wingA)"/>
      <!-- middle feather -->
      <path d="M 168 348
               C 216 330 258 300 290 258
               C 318 222 334 182 340 144
               C 356 150 370 160 382 172
               C 376 250 328 318 254 346
               C 226 356 196 356 168 348 Z"
            fill="url(#wingB)"/>
      <!-- top feather (small, cyan tip) -->
      <path d="M 196 316
               C 240 296 274 266 298 228
               C 316 200 326 170 328 140
               C 348 130 368 128 386 134
               C 392 200 362 266 306 300
               C 272 320 232 324 196 316 Z"
            fill="url(#wingC)"/>
    </g>
  </g>

  <!-- plate rim highlight -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" ry="114.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
</svg>
